<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Model Y - Painel Central</title>
    <style>
        :root {
            --bg-color: #0b0b0c;
            --panel-color: #18181a;
            --border-color: #2c2c2e;
            --accent-blue: #2f80ed;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        /* Lado Esquerdo: Controlos do Carro */
        .car-status {
            flex: 1;
            background-color: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .car-header h1 { font-size: 28px; font-weight: 400; letter-spacing: 1px; }
        .car-header p { color: var(--text-muted); font-size: 14px; }

        .visualizer {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 40px 0;
            background: radial-gradient(circle, rgba(47,128,237,0.1) 0%, transparent 70%);
            border-radius: 50%;
            position: relative;
        }

        .car-model { font-size: 72px; }
        
        .indicator {
            position: absolute;
            bottom: 20px;
            background: rgba(255,255,255,0.05);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid var(--border-color);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .btn {
            background-color: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .btn:hover { background-color: rgba(255,255,255,0.1); border-color: var(--text-muted); }
        .btn.active { border-color: var(--accent-blue); background-color: rgba(47,128,237,0.1); }

        /* Lado Direito: Emulador do Grok via Iframe */
        .grok-system {
            flex: 1.2;
            background-color: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- CONTROLOS DO CARRO -->
    <div class="car-status">
        <div class="car-header">
            <h1>Model Y</h1>
            <p>Sincronizado com Grok Bot v2026.26</p>
        </div>

        <div class="visualizer">
            <div class="car-model">🚗</div>
            <div class="indicator" id="car-mode">Modo: Standard</div>
        </div>

        <div class="controls-grid">
            <button class="btn" id="btn-clima">AC: 21°C</button>
            <button class="btn" id="btn-route">Rota: Nenhuma</button>
            <button class="btn" id="btn-battery">Pré-aquecer Bateria</button>
            <button class="btn" id="btn-persona">Persona: Clássica</button>
        </div>
    </div>

    <!-- SISTEMA INTERATIVO GROK -->
    <div class="grok-system">
        <iframe src="grok.html" id="grokFrame"></iframe>
    </div>

    <script>
        const grokFrame = document.getElementById('grokFrame');

        // Escuta os comandos enviados de dentro do chat do Grok
        window.addEventListener('message', function(event) {
            const data = event.data;

            if (data.action === 'update_car') {
                if (data.clima) document.getElementById('btn-clima').textContent = `AC: ${data.clima}`;
                if (data.route) document.getElementById('btn-route').textContent = `Rota: ${data.route}`;
                if (data.battery) {
                    const btn = document.getElementById('btn-battery');
                    btn.classList.add('active');
                    btn.textContent = "Bateria a Otimizar ⚡";
                }
                if (data.persona) {
                    document.getElementById('btn-persona').textContent = `Persona: ${data.persona}`;
                    document.getElementById('car-mode').textContent = `Modo: ${data.persona}`;
                }
            }
        });
    </script>
</body>
</html>
