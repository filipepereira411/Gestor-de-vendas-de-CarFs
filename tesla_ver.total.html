<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Model Y & Wallbox Integration</title>
    <style>
        :root {
            --bg-color: #0b0b0c;
            --panel-color: #18181a;
            --border-color: #2c2c2e;
            --accent-blue: #2f80ed;
            --accent-green: #219653;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }
        /* Painéis do Lado Esquerdo */
        .left-container {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }
        .panel {
            background-color: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .car-status { flex: 1.2; }
        .wallbox-status { flex: 0.8; }

        .panel-header h1 {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 1px;
        }
        .panel-header p {
            color: var(--text-muted);
            font-size: 13px;
        }
        
        .visualizer-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex: 1;
            margin: 15px 0;
        }
        .visualizer {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, rgba(47,128,237,0.1) 0%, transparent 70%);
            border-radius: 50%;
            position: relative;
        }
        .wallbox-status .visualizer {
            background: radial-gradient(circle, rgba(33,150,83,0.1) 0%, transparent 70%);
        }
        .display-icon { font-size: 44px; }
        .indicator {
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid var(--border-color);
            margin-top: 8px;
            text-align: center;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .btn {
            background-color: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .btn:hover {
            background-color: rgba(255,255,255,0.1);
            border-color: var(--text-muted);
        }
        .btn.active-blue {
            border-color: var(--accent-blue);
            background-color: rgba(47,128,237,0.1);
        }
        .btn.active-green {
            border-color: var(--accent-green);
            background-color: rgba(33,150,83,0.1);
        }

        /* Lado Direito: Sistema Interativo Grok */
        .grok-system {
            flex: 1;
            background-color: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- LADO ESQUERDO: VEÍCULO E WALLBOX -->
    <div class="left-container">
        
        <!-- PAINEL DO CARRO -->
        <div class="panel car-status">
            <div class="panel-header">
                <h1>Model Y</h1>
                <p>Sincronizado com Grok Bot v2026.26</p>
            </div>
            <div class="visualizer-container">
                <div class="visualizer">
                    <div class="display-icon">🚗</div>
                    <div class="indicator" id="car-mode">Modo: Standard</div>
                </div>
            </div>
            <div class="controls-grid">
                <button class="btn" id="btn-clima">AC: 21°C</button>
                <button class="btn" id="btn-route">Rota: Nenhuma</button>
                <button class="btn" id="btn-battery">Pré-aquecer Bateria</button>
                <button class="btn" id="btn-persona">Persona: Clássica</button>
            </div>
        </div>

        <!-- PAINEL DA WALLBOX -->
        <div class="panel wallbox-status">
            <div class="panel-header">
                <h1>Tesla Wall Connector</h1>
                <p>Gestor de Energia Inteligente</p>
            </div>
            <div class="visualizer-container">
                <div class="visualizer">
                    <div class="display-icon">⚡</div>
                    <div class="indicator" id="wallbox-state">Estado: Pronto</div>
                </div>
            </div>
            <div class="controls-grid">
                <button class="btn" id="btn-charge-rate">Corrente: 16A</button>
                <button class="btn" id="btn-charge-limit">Limite: 80%</button>
                <button class="btn" id="btn-wallbox-power">Potência: 11 kW</button>
                <button class="btn" id="btn-schedule">Programar: Off</button>
            </div>
        </div>

    </div>

    <!-- SISTEMA INTERATIVO GROK (IFRAME CORRESPONDENTE) -->
    <div class="grok-system">
        <iframe src="grok.html" id="grokFrame"></iframe>
    </div>

    <script>
        const grokFrame = document.getElementById('grokFrame');
        
        // Escuta os comandos unificados enviados de dentro do emulador do Grok (grok.html)
        window.addEventListener('message', function(event) {
            const data = event.data;
            
            // Tratamento de comandos para o Carro (Ex: Ações Rápidas do Grok)
            if (data.action === 'update_car') {
                if (data.clima) document.getElementById('btn-clima').textContent = `AC: ${data.clima}`;
                if (data.route) document.getElementById('btn-route').textContent = `Rota: ${data.route}`;
                if (data.battery) {
                    const btn = document.getElementById('btn-battery');
                    btn.classList.add('active-blue');
                    btn.textContent = "Bateria a Otimizar 🔋";
                }
                if (data.persona) {
                    document.getElementById('btn-persona').textContent = `Persona: ${data.persona}`;
                    document.getElementById('car-mode').textContent = `Modo: ${data.persona}`;
                }
            }
            
            // Tratamento de comandos para a Wallbox
            if (data.action === 'update_charger') {
                if (data.current) document.getElementById('btn-charge-rate').textContent = `Corrente: ${data.current}A`;
                if (data.limit) document.getElementById('btn-charge-limit').textContent = `Limite: ${data.limit}%`;
                if (data.power) document.getElementById('btn-wallbox-power').textContent = `Potência: ${data.power}`;
                if (data.schedule) document.getElementById('btn-schedule').textContent = `Programar: ${data.schedule}`;
                
                if (data.state) {
                    const stateIndicator = document.getElementById('wallbox-state');
                    stateIndicator.textContent = `Estado: ${data.state}`;
                    
                    const powerBtn = document.getElementById('btn-wallbox-power');
                    if(data.state.toLowerCase().includes('carregar')) {
                        powerBtn.classList.add('active-green');
                    } else {
                        powerBtn.classList.remove('active-green');
                    }
                }
            }
        });
    </script>
</body>
</html>
